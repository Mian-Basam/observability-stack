global:
  resolve_timeout: 5m

route:
  receiver: default
  group_by: [alertname, service, instance]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: [alertname="Watchdog"]
      receiver: heartbeat
      repeat_interval: 5m
    - matchers: [severity="critical"]
      receiver: oncall
      repeat_interval: 1h
    - matchers: [team="payments"]
      receiver: payments-team

inhibit_rules:
  # If a payments service is down, don't also page for its error rate / latency.
  # (equal on "team": recording rules aggregate away the "job" label, so
  #  "equal: [job]" would never match HighErrorRate - caught by the live test)
  - source_matchers: [alertname="ServiceDown"]
    target_matchers: [team="payments", alertname!="ServiceDown"]
    equal: [team]
  # Critical disk alert silences the "will fill" warning for the same mount.
  - source_matchers: [alertname="HostDiskAlmostFull"]
    target_matchers: [alertname="HostDiskWillFillIn24h"]
    equal: [instance, mountpoint]

receivers:
  - name: default
    webhook_configs:
      - url: http://webhook-logger:9095/default
        send_resolved: true
  - name: oncall
    webhook_configs:
      - url: http://webhook-logger:9095/oncall
        send_resolved: true
    # Real setup: replace or add, e.g.
    # slack_configs:
    #   - api_url_file: /etc/alertmanager/secrets/slack_url
    #     channel: "#oncall"
    # email_configs:
    #   - to: oncall@example.com
  - name: payments-team
    webhook_configs:
      - url: http://webhook-logger:9095/payments
        send_resolved: true
  - name: heartbeat
    webhook_configs:
      - url: http://webhook-logger:9095/heartbeat
